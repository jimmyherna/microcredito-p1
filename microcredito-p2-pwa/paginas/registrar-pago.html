<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrar pago — SGMC</title>
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="stylesheet" href="/css/base.css" />
</head>
<body>

  <header class="topbar">
    <button class="volver" onclick="history.back()" aria-label="Regresar">← Volver</button>
    <h1>Registrar pago</h1>
    <a href="/paginas/menu.html" class="btn-menu-top">Ir al menú</a>
  </header>

  <main class="pantalla">
    <!-- TARJETA CON EL DETALLE DE LA CUOTA A PAGAR -->
    <div id="infoCuota" class="tarjeta" style="margin-bottom: 1.25rem;">
      <h3 style="margin: 0 0 0.5rem; font-size: 1.05rem;">Monto a pagar</h3>
      <div id="detalleMontoPago">Cargando información del crédito...</div>
    </div>

    <form id="formPago">
      <label for="montoRecibido">Monto recibido (Q)</label>
      <input id="montoRecibido" type="number" step="0.01" inputmode="decimal" placeholder="Q 0.00" required />

      <button id="btnConfirmarPago" type="submit" class="primario">Confirmar pago</button>
    </form>

    <p id="estadoPago" style="margin-top: 1rem; font-weight: 600;"></p>
  </main>

  <script type="module" src="/dist/app.js"></script>
  <script type="module" src="/dist/paginas/registrar-pago.js"></script>
</body>
</html>
