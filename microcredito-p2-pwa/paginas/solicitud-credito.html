<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solicitud de crédito — SGMC</title>
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="stylesheet" href="/css/base.css" />
</head>
<body>

  <header class="topbar">
    <button class="volver" onclick="history.back()" aria-label="Regresar">← Volver</button>
    <h1>Solicitud de crédito</h1>
    <a href="/paginas/menu.html" class="btn-menu-top">Ir al menú</a>
  </header>

  <main class="pantalla">
    <form id="formSolicitud">
      <label for="cliente">Cliente</label>
      <input id="cliente" required />

      <label for="monto">Monto (Q)</label>
      <input id="monto" type="number" min="1000" max="25000" step="1" required />

      <label for="plazo">Plazo (meses)</label>
      <input id="plazo" type="number" min="3" max="24" step="1" required />

      <p id="estimacionCuota" style="font-weight: 600; color: var(--color-oscuro); margin-top: 1rem;"></p>

      <button type="submit" class="primario">Enviar solicitud</button>
    </form>

    <!-- MENSAJES Y NOTIFICACIONES DE SCRIPT -->
    <p id="mensajeEstado" style="margin-top: 1rem; font-weight: 600;"></p>
    <div id="resultadoSolicitud" style="margin-top: 1rem;"></div>

    <!-- BOTÓN Y PANEL DE AYUDA -->
    <button id="btnAyuda" class="boton-ayuda" type="button" aria-label="Ayuda">?</button>
    
    <div id="panelAyuda" class="panel-ayuda oculto">
      <p id="textoAyuda">Completa el monto y el plazo para ver la cuota estimada. Al confirmar, la solicitud queda pendiente de aprobación del comité.</p>
      <button id="btnCerrarAyuda" class="secundario cerrar-ayuda" type="button">Entendido</button>
    </div>
  </main>

  <script type="module" src="/dist/app.js"></script>
  <script type="module" src="/dist/paginas/solicitud-credito.js"></script>
</body>
</html>
