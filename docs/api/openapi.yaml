openapi: 3.0.3
info:
  title: API - Sistema de Gestion de Microcredito (Credito Vecino, S.A.)
  version: "1.0.0"
  description: >
    Contrato de los casos de uso del nucleo hexagonal (Proyecto 1, E5).
    Los esquemas se derivan de validadores Zod y definen el contrato de entradas y salidas.
servers:
  - url: https://api.creditovecino.example.com/v1
    description: Entorno de referencia (no implementado en el Proyecto 1)

paths:
  /clientes:
    post:
      summary: Registrar un nuevo cliente (UC1)
      operationId: registrarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoCliente" }
      responses:
        "201":
          description: Cliente creado exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cliente" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }

  /clientes/{id}:
    get:
      summary: Consultar un cliente por su ID (UC1)
      operationId: consultarCliente
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cliente" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /solicitudes:
    post:
      summary: Solicitar un nuevo credito (UC2)
      operationId: solicitarCredito
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaSolicitudCredito" }
      responses:
        "201":
          description: Solicitud registrada exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolicitudCredito" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }

  /solicitudes/{id}/evaluar:
    post:
      summary: Evaluar (aprobar o rechazar) una solicitud (UC3)
      operationId: evaluarSolicitud
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionComite" }
      responses:
        "200":
          description: Solicitud evaluada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolicitudCredito" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/TransicionInvalida" }

  /creditos/{id}/desembolsar:
    post:
      summary: Desembolsar un credito aprobado y generar plan de amortizacion (UC4)
      operationId: desembolsarCredito
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      responses:
        "200":
          description: Credito desembolsado exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credito" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/TransicionInvalida" }

  /creditos/{id}:
    get:
      summary: Consultar un credito, su plan, estado y tramo de mora (UC4 / UC5)
      operationId: consultarCredito
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credito" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /creditos/{id}/reestructurar:
    post:
      summary: Reestructurar un credito con atraso o mora (UC7)
      operationId: reestructurarCredito
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaReestructuracion" }
      responses:
        "200":
          description: Credito reestructurado exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credito" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/TransicionInvalida" }

  /pagos:
    post:
      summary: Registrar pago de cuota aplicando prelacion de pagos (UC5)
      operationId: registrarPago
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoPago" }
      responses:
        "200":
          description: Pago aplicado exitosamente (o recuperado idempotentemente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultadoPago" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/TransicionInvalida" }

  /cierres/diario:
    post:
      summary: Ejecutar proceso de cierre diario (UC6)
      operationId: ejecutarCierreDiario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComandoCierreDiario" }
      responses:
        "200":
          description: Cierre diario procesado o recuperado (idempotente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cierre" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }

  /cierres/mensual:
    post:
      summary: Ejecutar proceso de cierre mensual (UC6)
      operationId: ejecutarCierreMensual
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComandoCierreMensual" }
      responses:
        "200":
          description: Cierre mensual procesado o recuperado (idempotente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cierre" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }

  /cartera/en-riesgo:
    get:
      summary: Consultar reporte de cartera en riesgo (PAR) por fecha de corte (UC6)
      operationId: consultarCarteraEnRiesgo
      parameters:
        - name: fechaCorte
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarteraEnRiesgo" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    ErrorValidacion:
      description: Error de validacion de entrada de datos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoEncontrado:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TransicionInvalida:
      description: >
        La operacion no es aplicable al estado actual del credito o solicitud.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: { type: string, example: "TRANSICION_INVALIDA" }
        mensaje: { type: string }
        detalles: { type: object, additionalProperties: true }

    Dinero:
      type: object
      description: Objeto de valor Dinero. `centavos` es la fuente de verdad.
      required: [centavos, moneda]
      properties:
        centavos: { type: integer, example: 100462 }
        moneda: { type: string, enum: [GTQ, USD], example: GTQ }
        monto: { type: number, readOnly: true, example: 1004.62 }

    NuevoCliente:
      type: object
      required: [nombre, dpi, direccion]
      properties:
        nombre: { type: string, example: "Juan Perez" }
        dpi: { type: string, pattern: "^[0-9]{13}$", example: "1234567890101" }
        direccion: { type: string, example: "Guatemala, Guatemala" }

    Cliente:
      allOf:
        - $ref: "#/components/schemas/NuevoCliente"
        - type: object
          required: [id]
          properties:
            id: { type: string, example: "cli-12345" }

    NuevaSolicitudCredito:
      type: object
      required: [clienteId, montoSolicitado, plazoMeses]
      properties:
        clienteId: { type: string, example: "cli-12345" }
        montoSolicitado: { $ref: "#/components/schemas/Dinero" }
        plazoMeses: { type: integer, minimum: 3, maximum: 24, example: 12 }

    SolicitudCredito:
      allOf:
        - $ref: "#/components/schemas/NuevaSolicitudCredito"
        - type: object
          required: [id, estado, fechaSolicitud]
          properties:
            id: { type: string, example: "sol-98765" }
            estado: { type: string, enum: [SOLICITADO, APROBADO, RECHAZADO, ANULADO] }
            fechaSolicitud: { type: string, format: date, example: "2026-08-01" }

    DecisionComite:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APRUEBA, RECHAZA] }
        motivo: { type: string, example: "Cumple con perfil crediticio" }

    NuevaReestructuracion:
      type: object
      required: [nuevoPlazoMeses, nuevaTasaMensual]
      properties:
        nuevoPlazoMeses: { type: integer, minimum: 3, maximum: 36, example: 18 }
        nuevaTasaMensual: { type: number, example: 0.025 }
        motivo: { type: string, example: "Capacidad de pago ajustada" }

    Credito:
      type: object
      required: [id, estado, capitalDesembolsado, tasaMensual, numeroCuotas]
      properties:
        id: { type: string, example: "cre-55555" }
        estado:
          type: string
          enum: [SOLICITADO, APROBADO, RECHAZADO, ANULADO, VIGENTE, EN_MORA, REESTRUCTURADO, CANCELADO, INCOBRABLE]
        tramo:
          type: string
          enum: [AL_DIA, MORA_1, MORA_2, MORA_3, VENCIDO, INCOBRABLE]
          description: Clasificacion derivada de los dias de atraso.
        capitalDesembolsado: { $ref: "#/components/schemas/Dinero" }
        tasaMensual: { type: number, example: 0.03 }
        numeroCuotas: { type: integer, example: 12 }
        politicaVersion: { type: string, example: "2026.1" }

    NuevoPago:
      type: object
      required: [creditoId, monto, claveIdempotencia]
      properties:
        creditoId: { type: string, example: "cre-55555" }
        monto: { $ref: "#/components/schemas/Dinero" }
        claveIdempotencia:
          type: string
          example: "pago-unique-uuid-123"
          description: Evita doble cobro en reintentos.
        fecha: { type: string, format: date, example: "2026-08-28" }

    DesgloseAplicacionRubro:
      type: object
      properties:
        rubro: { type: string, enum: [gastos, interesMoratorio, interesCorriente, capital] }
        adeudado: { $ref: "#/components/schemas/Dinero" }
        aplicado: { $ref: "#/components/schemas/Dinero" }
        pendiente: { $ref: "#/components/schemas/Dinero" }

    ResultadoPago:
      type: object
      properties:
        detalle:
          type: array
          items: { $ref: "#/components/schemas/DesgloseAplicacionRubro" }
        excedente: { $ref: "#/components/schemas/Dinero" }
        cuotaSaldada: { type: boolean }
        nuevoEstado: { type: string }
        tramo: { type: string }

    ComandoCierreDiario:
      type: object
      required: [fechaCorte]
      properties:
        fechaCorte: { type: string, format: date, example: "2026-08-28" }

    ComandoCierreMensual:
      type: object
      required: [fechaCorte]
      properties:
        fechaCorte: { type: string, format: date, example: "2026-08-31" }

    Cierre:
      type: object
      properties:
        fechaCorte: { type: string, format: date }
        tipo: { type: string, enum: [DIARIO, MENSUAL] }
        carteraActiva: { $ref: "#/components/schemas/Dinero" }
        carteraEnRiesgo: { $ref: "#/components/schemas/Dinero" }
        porcentajeEnRiesgo: { type: number, minimum: 0, maximum: 1, example: 0.07 }
        dadoPorIncobrableEnPeriodo: { $ref: "#/components/schemas/Dinero" }

    CarteraEnRiesgo:
      type: object
      properties:
        fechaCorte: { type: string, format: date }
        carteraActiva: { $ref: "#/components/schemas/Dinero" }
        carteraEnRiesgo: { $ref: "#/components/schemas/Dinero" }
        porcentaje: { type: number, minimum: 0, maximum: 1 }
        creditosEnRiesgo:
          type: array
          items: { type: string }