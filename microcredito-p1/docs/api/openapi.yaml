openapi: 3.0.3
info:
  title: API - Sistema de Gestion de Microcredito (Credito Vecino, S.A.)
  version: "1.0.0"
  description: >
    Contrato de los casos de uso del nucleo hexagonal (Proyecto 1, E5).
    Los esquemas se derivan de validadores Zod y definen el contrato de entradas y salidas.
servers:
  - url: https://api.creditovecino.example.com/v1
    description: Entorno de referencia (no implementado en el Proyecto 1)
  - url: http://localhost:3000/api
    description: API real del Proyecto Final (todas las rutas de este documento cuelgan de /api)

# Seguridad (Proyecto Final): todo /api/* exige `Authorization: Bearer <token>` salvo /salud y
# /auth/{registro,login,asesores-disponibles}. El token (HMAC-SHA256, expira en 12 h) se obtiene en
# /auth/login o /auth/registro. 401 {codigo:NO_AUTENTICADO} sin/ con token inválido;
# 403 {codigo:SIN_PERMISO} si el rol o el alcance de datos no lo permite.
security:
  - bearerAuth: []

paths:
  /clientes:
    post:
      summary: Registrar un nuevo cliente (UC1)
      operationId: registrarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoCliente" }
      responses:
        "201":
          description: Cliente creado exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cliente" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }

  /clientes/{id}:
    get:
      summary: Consultar un cliente por su ID (UC1)
      operationId: consultarCliente
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cliente" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /solicitudes:
    post:
      summary: Solicitar un nuevo credito (UC2)
      operationId: solicitarCredito
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaSolicitudCredito" }
      responses:
        "201":
          description: Solicitud registrada exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolicitudCredito" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }

  /solicitudes/{id}/evaluar:
    post:
      summary: Evaluar (aprobar o rechazar) una solicitud (UC3)
      operationId: evaluarSolicitud
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionComite" }
      responses:
        "200":
          description: Solicitud evaluada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolicitudCredito" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/TransicionInvalida" }

  /creditos/{id}/desembolsar:
    post:
      summary: Desembolsar un credito aprobado y generar plan de amortizacion (UC4)
      operationId: desembolsarCredito
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      responses:
        "200":
          description: Credito desembolsado exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credito" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/TransicionInvalida" }

  /creditos/{id}:
    get:
      summary: Consultar un credito, su plan, estado y tramo de mora (UC4 / UC5)
      operationId: consultarCredito
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credito" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /creditos/{id}/reestructurar:
    post:
      summary: Reestructurar un credito con atraso o mora (UC7)
      operationId: reestructurarCredito
      parameters: [ { $ref: "#/components/parameters/IdPath" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevaReestructuracion" }
      responses:
        "200":
          description: Credito reestructurado exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credito" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/TransicionInvalida" }

  /pagos:
    post:
      summary: Registrar pago de cuota aplicando prelacion de pagos (UC5)
      operationId: registrarPago
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NuevoPago" }
      responses:
        "200":
          description: Pago aplicado exitosamente (o recuperado idempotentemente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultadoPago" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/TransicionInvalida" }

  /cierres/diario:
    post:
      summary: Ejecutar proceso de cierre diario (UC6)
      operationId: ejecutarCierreDiario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComandoCierreDiario" }
      responses:
        "200":
          description: Cierre diario procesado o recuperado (idempotente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cierre" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }

  /cierres/mensual:
    post:
      summary: Ejecutar proceso de cierre mensual (UC6)
      operationId: ejecutarCierreMensual
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComandoCierreMensual" }
      responses:
        "200":
          description: Cierre mensual procesado o recuperado (idempotente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cierre" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }

  /cartera/en-riesgo:
    get:
      summary: Consultar reporte de cartera en riesgo (PAR) por fecha de corte (UC6)
      operationId: consultarCarteraEnRiesgo
      parameters:
        - name: fechaCorte
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarteraEnRiesgo" }
        "400": { $ref: "#/components/responses/ErrorValidacion" }

  # ---- Proyecto Final: rutas implementadas en src/api/servidor.ts (prefijo real: /api) ----
  /solicitudes/{id}:
    get:
      summary: Detalle de una solicitud (estado, monto, plazo, cliente)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: SOLICITUD_INEXISTENTE } }
  /solicitudes/{id}/desembolsar:
    post:
      summary: Desembolsar una solicitud APROBADA (UC4). Valida la TNA contra la política de crédito vigente.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [asesorId, fechaDesembolso, tnaBps]
              properties:
                creditoId: { type: string, example: CV-2026-9001 }
                asesorId: { type: string, example: AS-01 }
                fechaDesembolso: { type: string, format: date }
                tnaBps: { type: integer, example: 3600 }
      responses: { "200": { description: Crédito creado }, "400": { description: Tasa fuera de rango o asesor inexistente } }
  /asesores:
    get: { summary: Catálogo de asesores, responses: { "200": { description: OK } } }
  /politica-credito:
    get:
      summary: Política de crédito vigente (rango de TNA, tasa sugerida, montos y plazos) y TEA de la tasa sugerida
      parameters: [{ name: fechaCorte, in: query, schema: { type: string, format: date } }]
      responses: { "200": { description: OK } }
  /plan-simulado:
    post:
      summary: Plan de amortización simulado (antes de confirmar) con la TEA
      responses: { "200": { description: "{ tea, filas[] }" } }
  /creditos/{id}/mora:
    get:
      summary: Explicar la mora (tramos recorridos). Con ?cuota=N explica la mora de esa cuota concreta.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: fechaCorte, in: query, schema: { type: string, format: date } }
        - { name: cuota, in: query, schema: { type: integer } }
      responses: { "200": { description: OK } }
  /pagos/validar:
    post:
      summary: Valida un pago NUEVO (monto exacto, incobrable, cuotas pendientes) sin emitir token
      responses: { "200": { description: "{ yaAplicado }" }, "422": { description: MONTO_NO_EXACTO / CREDITO_INCOBRABLE / CUOTA_YA_PAGADA } }
  /pagos/solicitar-aprobacion:
    post:
      summary: Emite el token de aprobación humana (un solo uso, 5 min, ligado a crédito+monto+clave). Solo la UI lo pide, al tocar "Aprobar".
      responses: { "200": { description: "{ tokenAprobacion, expiraEnSegundos }" } }

  # ---- Autenticación, alcance por rol y analítica gerencial ----
  /salud:
    get: { summary: Salud del servicio (pública), security: [], responses: { "200": { description: "{ ok: true }" } } }
  /auth/registro:
    post:
      summary: Crear cuenta (pública). cliente (con dpi se vincula al cliente existente sin cuenta), asesor (asesorId existente libre, o se crea uno nuevo ASE-xxx) o gerencia (exige codigoComite = CV_CODIGO_GERENCIA).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, identificador, contrasena, rol]
              properties:
                nombre: { type: string }
                identificador: { type: string, description: Correo (se guarda en minúsculas) o teléfono (sólo dígitos), example: ana@correo.com }
                contrasena: { type: string, minLength: 8 }
                rol: { type: string, enum: [cliente, asesor, gerencia] }
                dpi: { type: string, description: "Sólo cliente: vincula la cuenta con el cliente existente de ese DPI" }
                asesorId: { type: string, description: "Sólo asesor: vincula con un asesor de /auth/asesores-disponibles" }
                codigoComite: { type: string, description: "Sólo gerencia" }
      responses:
        "201": { description: "{ token, usuario }", content: { application/json: { schema: { $ref: "#/components/schemas/SesionIniciada" } } } }
        "400": { $ref: "#/components/responses/ErrorValidacion" }
        "403": { description: Código del comité incorrecto (SIN_PERMISO) }
        "409": { description: Identificador ya registrado (IDENTIFICADOR_DUPLICADO) }
  /auth/login:
    post:
      summary: Iniciar sesión (pública). El rol sale de la cuenta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identificador, contrasena]
              properties:
                identificador: { type: string }
                contrasena: { type: string }
      responses:
        "200": { description: "{ token, usuario }", content: { application/json: { schema: { $ref: "#/components/schemas/SesionIniciada" } } } }
        "401": { description: Credenciales inválidas (mensaje genérico; CREDENCIALES_INVALIDAS) }
  /auth/yo:
    get: { summary: Usuario de la sesión actual, responses: { "200": { description: Usuario, content: { application/json: { schema: { $ref: "#/components/schemas/Usuario" } } } }, "401": { description: NO_AUTENTICADO } } }
  /auth/asesores-disponibles:
    get:
      summary: Asesores que aún no tienen cuenta (para elegir al registrarse como asesor). Pública.
      security: []
      responses: { "200": { description: "[{ id, nombre }]" } }
  /mi-perfil:
    get: { summary: "Usuario y su ficha de cliente (o null si aún no la tiene)", responses: { "200": { description: "{ usuario, cliente }" } } }
  /creditos:
    get:
      summary: Créditos visibles según el rol (cliente - los suyos; asesor - su cartera; gerencia - todos). Incluye asesorNombre.
      parameters: [{ name: fechaCorte, in: query, schema: { type: string, format: date }, description: "Si falta, se usa la fecha de HOY en Guatemala (UTC-6) o CV_FECHA_OPERACION" }]
      responses: { "200": { description: "[{ id, clienteNombre, asesorNombre, estado, tramo, saldoCapital, diasDeAtraso }]" } }
  /creditos-en-mora:
    get: { summary: Créditos en mora (asesor - su cartera; gerencia - todos; cliente - 403), responses: { "200": { description: OK }, "403": { description: SIN_PERMISO } } }
  /vencimientos:
    get: { summary: Próximos vencimientos dentro del alcance del usuario, responses: { "200": { description: OK } } }
  /gerencia/resumen:
    get:
      summary: Analítica gerencial (sólo gerencia)
      parameters: [{ name: fechaCorte, in: query, schema: { type: string, format: date } }]
      responses:
        "200":
          description: Resumen
          content: { application/json: { schema: { $ref: "#/components/schemas/ResumenGerencial" } } }
        "403": { description: SIN_PERMISO }
  /gerencia/bitacora:
    get:
      summary: Bitácora de actividad, más reciente primero (sólo gerencia)
      parameters: [{ name: limite, in: query, schema: { type: integer, default: 50, maximum: 500 } }]
      responses: { "200": { description: "[{ id, fecha, usuarioNombre, rol, accion, detalle }]" }, "403": { description: SIN_PERMISO } }
  /gerencia/usuarios:
    get: { summary: Cuentas registradas (sólo gerencia), responses: { "200": { description: "[{ id, nombre, identificador, rol, creadoEn, ultimoAcceso }]" }, "403": { description: SIN_PERMISO } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: "Token HMAC-SHA256 (12 h)" }

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    ErrorValidacion:
      description: Error de validacion de entrada de datos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoEncontrado:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TransicionInvalida:
      description: >
        La operacion no es aplicable al estado actual del credito o solicitud.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Usuario:
      type: object
      properties:
        id: { type: string, example: USR-1A2B3C4D }
        nombre: { type: string }
        identificador: { type: string }
        rol: { type: string, enum: [cliente, asesor, gerencia] }
        clienteId: { type: string, nullable: true }
        asesorId: { type: string, nullable: true }

    SesionIniciada:
      type: object
      properties:
        token: { type: string }
        usuario: { $ref: "#/components/schemas/Usuario" }

    ResumenGerencial:
      type: object
      properties:
        fechaCorte: { type: string, format: date }
        conteos:
          type: object
          properties: { clientes: { type: integer }, asesores: { type: integer }, usuarios: { type: integer }, creditosActivos: { type: integer }, creditosEnMora: { type: integer }, solicitudesPendientes: { type: integer } }
        solicitudesPorEstado: { type: array, items: { type: object, properties: { estado: { type: string }, cantidad: { type: integer } } } }
        porAsesor:
          type: array
          items:
            type: object
            properties:
              asesorId: { type: string }
              nombre: { type: string }
              creditos: { type: integer }
              carteraActiva: { $ref: "#/components/schemas/Dinero" }
              carteraEnRiesgo: { $ref: "#/components/schemas/Dinero" }
              porcentajeRiesgo: { type: number, minimum: 0, maximum: 1, description: Fracción 0..1 (igual que /cartera/en-riesgo) }
              solicitudesPendientes: { type: integer }
        cobrosPorMes: { type: array, description: Últimos 6 meses hasta fechaCorte, items: { type: object, properties: { mes: { type: string, example: "2026-10" }, total: { $ref: "#/components/schemas/Dinero" }, pagos: { type: integer } } } }
        pagosRecientes: { type: array, maxItems: 10, items: { type: object, properties: { fecha: { type: string, format: date }, creditoId: { type: string }, clienteNombre: { type: string }, monto: { $ref: "#/components/schemas/Dinero" } } } }
        vencimientosProximos: { type: object, properties: { dias: { type: integer, example: 7 }, cantidad: { type: integer }, total: { $ref: "#/components/schemas/Dinero" } } }

    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: { type: string, example: "TRANSICION_INVALIDA" }
        mensaje: { type: string }
        detalles: { type: object, additionalProperties: true }

    Dinero:
      type: object
      description: Objeto de valor Dinero. `centavos` es la fuente de verdad.
      required: [centavos, moneda]
      properties:
        centavos: { type: integer, example: 100462 }
        moneda: { type: string, enum: [GTQ, USD], example: GTQ }
        monto: { type: number, readOnly: true, example: 1004.62 }

    NuevoCliente:
      type: object
      required: [nombre, dpi, direccion]
      properties:
        nombre: { type: string, example: "Juan Perez" }
        dpi: { type: string, pattern: "^[0-9]{13}$", example: "1234567890101" }
        direccion: { type: string, example: "Guatemala, Guatemala" }

    Cliente:
      allOf:
        - $ref: "#/components/schemas/NuevoCliente"
        - type: object
          required: [id]
          properties:
            id: { type: string, example: "cli-12345" }

    NuevaSolicitudCredito:
      type: object
      required: [clienteId, montoSolicitado, plazoMeses]
      properties:
        clienteId: { type: string, example: "cli-12345" }
        montoSolicitado: { $ref: "#/components/schemas/Dinero" }
        plazoMeses: { type: integer, minimum: 3, maximum: 24, example: 12 }

    SolicitudCredito:
      allOf:
        - $ref: "#/components/schemas/NuevaSolicitudCredito"
        - type: object
          required: [id, estado, fechaSolicitud]
          properties:
            id: { type: string, example: "sol-98765" }
            estado: { type: string, enum: [SOLICITADO, APROBADO, RECHAZADO, ANULADO] }
            fechaSolicitud: { type: string, format: date, example: "2026-08-01" }

    DecisionComite:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APRUEBA, RECHAZA] }
        motivo: { type: string, example: "Cumple con perfil crediticio" }

    NuevaReestructuracion:
      type: object
      required: [nuevoPlazoMeses, nuevaTasaMensual]
      properties:
        nuevoPlazoMeses: { type: integer, minimum: 3, maximum: 36, example: 18 }
        nuevaTasaMensual: { type: number, example: 0.025 }
        motivo: { type: string, example: "Capacidad de pago ajustada" }

    Credito:
      type: object
      required: [id, estado, capitalDesembolsado, tasaMensual, numeroCuotas]
      properties:
        id: { type: string, example: "cre-55555" }
        estado:
          type: string
          enum: [SOLICITADO, APROBADO, RECHAZADO, ANULADO, VIGENTE, EN_MORA, REESTRUCTURADO, CANCELADO, INCOBRABLE]
        tramo:
          type: string
          enum: [AL_DIA, MORA_1, MORA_2, MORA_3, VENCIDO, INCOBRABLE]
          description: Clasificacion derivada de los dias de atraso.
        capitalDesembolsado: { $ref: "#/components/schemas/Dinero" }
        tasaMensual: { type: number, example: 0.03 }
        numeroCuotas: { type: integer, example: 12 }
        politicaVersion: { type: string, example: "2026.1" }

    NuevoPago:
      type: object
      required: [creditoId, monto, claveIdempotencia]
      properties:
        creditoId: { type: string, example: "cre-55555" }
        monto: { $ref: "#/components/schemas/Dinero" }
        claveIdempotencia:
          type: string
          example: "pago-unique-uuid-123"
          description: Evita doble cobro en reintentos.
        fecha: { type: string, format: date, example: "2026-08-28" }

    DesgloseAplicacionRubro:
      type: object
      properties:
        rubro: { type: string, enum: [gastos, interesMoratorio, interesCorriente, capital] }
        adeudado: { $ref: "#/components/schemas/Dinero" }
        aplicado: { $ref: "#/components/schemas/Dinero" }
        pendiente: { $ref: "#/components/schemas/Dinero" }

    ResultadoPago:
      type: object
      properties:
        detalle:
          type: array
          items: { $ref: "#/components/schemas/DesgloseAplicacionRubro" }
        excedente: { $ref: "#/components/schemas/Dinero" }
        cuotaSaldada: { type: boolean }
        nuevoEstado: { type: string }
        tramo: { type: string }

    ComandoCierreDiario:
      type: object
      required: [fechaCorte]
      properties:
        fechaCorte: { type: string, format: date, example: "2026-08-28" }

    ComandoCierreMensual:
      type: object
      required: [fechaCorte]
      properties:
        fechaCorte: { type: string, format: date, example: "2026-08-31" }

    Cierre:
      type: object
      properties:
        fechaCorte: { type: string, format: date }
        tipo: { type: string, enum: [DIARIO, MENSUAL] }
        carteraActiva: { $ref: "#/components/schemas/Dinero" }
        carteraEnRiesgo: { $ref: "#/components/schemas/Dinero" }
        porcentajeEnRiesgo: { type: number, minimum: 0, maximum: 1, example: 0.07 }
        dadoPorIncobrableEnPeriodo: { $ref: "#/components/schemas/Dinero" }

    CarteraEnRiesgo:
      type: object
      properties:
        fechaCorte: { type: string, format: date }
        carteraActiva: { $ref: "#/components/schemas/Dinero" }
        carteraEnRiesgo: { $ref: "#/components/schemas/Dinero" }
        porcentaje: { type: number, minimum: 0, maximum: 1 }
        creditosEnRiesgo:
          type: array
          items: { type: string }