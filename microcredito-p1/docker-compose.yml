version: '3.8'

services:
  bd:
    image: pgvector/pgvector:pg16
    container_name: credito_vecino_bd
    restart: unless-stopped
    environment:
      POSTGRES_USER: credito_vecino
      POSTGRES_PASSWORD: credito_vecino
      POSTGRES_DB: credito_vecino
    ports:
      - "5433:5432"
    volumes:
      - credito_vecino_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credito_vecino -d credito_vecino"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    container_name: credito_vecino_backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://credito_vecino:credito_vecino@bd:5432/credito_vecino
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      bd:
        condition: service_healthy

  frontend:
    build: ./web
    container_name: credito_vecino_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  credito_vecino_datos: